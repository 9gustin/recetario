<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lista de compras</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A8431A}a:hover{color:#7E3010}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8EFE2; color: #2A1D14; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div>
        <p style="margin: 0; font-size: 13px; font-weight: 600; color: #6E5A48">Plan del 16 al 22</p>
        <h1 style="margin: 2px 0 0; font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.05">Compra del lunes</h1>
      </div>
      <div style="display: flex; align-items: center">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: #F4C35A; border: 2px solid #F8EFE2; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">A</span>
        <span style="width: 32px; height: 32px; margin-left: -8px; border-radius: 50%; background: #E9A58A; border: 2px solid #F8EFE2; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">S</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; height: 8px; border-radius: 99px; background: #EAD9C2; overflow: hidden"><div style="width: 75%; height: 100%; border-radius: 99px; background: #2A1D14"></div></div>
      <span style="font-size: 13px; font-weight: 700">18/24</span>
    </div>
    <label style="display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 14px; border-radius: 14px; background: #FFF8EE; border: 1px solid #EAD9C2">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E5A48" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Agregar a la lista</span>
      <input type="text" placeholder="Agregar algo…" style="flex: 1; border: 0; background: transparent; font: inherit; font-size: 15px; color: #2A1D14; outline: none">
    </label>
  </header>

  <main style="flex: 1; padding: 0 20px; display: flex; flex-direction: column; gap: 14px">
    <section style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #6E5A48">VERDULERÍA</h2>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 14px; border-radius: 14px; background: #FFF8EE; border: 1px solid #EAD9C2">
        <input type="checkbox" style="width: 22px; height: 22px; accent-color: #2A1D14">
        <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">Rúcula</span><span style="display: block; font-size: 12px; color: #A8431A">Dura 3 días: la del jueves, a mitad de semana</span></span>
        <span style="font-size: 13px; color: #6E5A48">1 atado</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 14px; border-radius: 14px; background: #FFF8EE; border: 1px solid #EAD9C2">
        <input type="checkbox" style="width: 22px; height: 22px; accent-color: #2A1D14">
        <span style="flex: 1; font-size: 15px; font-weight: 600">Palta</span><span style="font-size: 13px; color: #6E5A48">2 unidades</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 14px; border-radius: 14px; background: #F1E4D1">
        <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #2A1D14">
        <span style="flex: 1; font-size: 15px; color: #6E5A48; text-decoration: line-through">Zapallitos</span><span style="font-size: 13px; color: #6E5A48">600 g</span>
      </label>
    </section>
    <section style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #6E5A48">CARNICERÍA Y PESCADERÍA</h2>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 14px; border-radius: 14px; background: #FFF8EE; border: 1px solid #EAD9C2">
        <input type="checkbox" style="width: 22px; height: 22px; accent-color: #2A1D14">
        <span style="flex: 1; font-size: 15px; font-weight: 600">Pechuga de pollo</span><span style="font-size: 13px; color: #6E5A48">2 (~800 g)</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 14px; border-radius: 14px; background: #FFF8EE; border: 1px solid #EAD9C2">
        <input type="checkbox" style="width: 22px; height: 22px; accent-color: #2A1D14">
        <span style="flex: 1; font-size: 15px; font-weight: 600">Salmón</span><span style="font-size: 13px; color: #6E5A48">2 filetes</span>
      </label>
    </section>
    <p style="margin: 0; font-size: 12px; color: #6E5A48; text-align: center">Deslizá a la izquierda lo que ya tenés en casa</p>
  </main>

  <nav aria-label="Principal" style="height: 76px; flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: 8px; box-sizing: border-box; background: #FFF8EE; border-top: 1px solid #EAD9C2">
    <a href="Mediodia.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #6E5A48; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>Hoy</a>
    <a href="Recetas.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #6E5A48; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h13v16H6.5A1.5 1.5 0 0 1 5 18.5zM5 18.5A1.5 1.5 0 0 1 6.5 17H18"></path></svg>Recetas</a>
    <a href="Plan.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #6E5A48; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Plan</a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #A8431A; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7zM9 8a3 3 0 0 1 6 0"></path></svg>Compras</a>
    <a href="Perfil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #6E5A48; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Perfil</a>
  </nav>
</div>
</x-dc>

</body>
</html>
